<!DOCTYPE html>
<html>
<head>
    <title>CartZen Cookie Cleaner</title>
    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; background: #f0f2f5; }
        .card { background: white; padding: 2rem; border-radius: 8px; shadow: 0 4px 6px rgba(0,0,0,0.1); text-align: center; }
        button { background: #6366f1; color: white; border: none; padding: 0.75rem 1.5rem; border-radius: 4px; cursor: pointer; font-weight: bold; }
        button:hover { background: #4f46e5; }
        .success { color: #10b981; margin-top: 1rem; display: none; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Clear Localhost Cookies</h1>
        <p>This will clear all cookies for <b>localhost</b> to fix the HTTP 431 error.</p>
        <button onclick="clearCookies()">Clear Now</button>
        <div id="success" class="success">Cookies cleared! You can now open <a href="http://localhost:3005">http://localhost:3005</a></div>
    </div>
    <script>
        function clearCookies() {
            const cookies = document.cookie.split(";");
            for (let i = 0; i < cookies.length; i++) {
                const cookie = cookies[i];
                const eqPos = cookie.indexOf("=");
                const name = eqPos > -1 ? cookie.substr(0, eqPos) : cookie;
                document.cookie = name + "=;expires=Thu, 01 Jan 1970 00:00:00 GMT;path=/";
                document.cookie = name + "=;expires=Thu, 01 Jan 1970 00:00:00 GMT;domain=localhost;path=/";
            }
            document.getElementById('success').style.display = 'block';
        }
    </script>
</body>
</html>
